name: Build Android APK

on:
  push:
    branches: [ "main", "v2-" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        run: |
          cd app
          npm install

      - name: Copy web assets to app/www
        run: |
          mkdir -p app/www
          cp index.html app/www/
          cp styles.css app/www/
          cp main.js app/www/
          cp -r img app/www/ || true
          cp "Offered Course Report.csv" app/www/ || true

      - name: Capacitor Sync
        run: |
          cd app
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build with Gradle
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v2-'
        with:
          tag_name: latest
          name: Latest Android Build
          body: "This is the latest automated build of the Classify Android App."
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
